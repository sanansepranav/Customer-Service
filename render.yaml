services:
  - type: web
    name: prince-tailor-studio
    env: node
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 20.x
      - key: DATABASE_URL
        value: file:/data/sqlite.db
